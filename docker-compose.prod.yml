# Production stack.
#
# Deliberately different from the development one in three ways:
#
#   * no bind mounts — images contain their own code, so a deploy cannot
#     be affected by whatever happens to be on the host, and Docker's
#     host file-sharing allowlist is irrelevant;
#   * real servers — gunicorn behind nginx, not runserver and Vite;
#   * the database is not published to the host.
#
# Usage:
#   cp .env.example .env      # then set the secrets
#   docker compose -f docker-compose.prod.yml up -d --build

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # No `ports`: the database is reachable only from the compose network.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?set DJANGO_ALLOWED_HOSTS}
      ACCESS_CODE_HMAC_KEY: ${ACCESS_CODE_HMAC_KEY:?set ACCESS_CODE_HMAC_KEY}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      MEDIA_ROOT: /app/media
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS}
      NURSERY_TIMEZONE: ${NURSERY_TIMEZONE:-Africa/Tunis}
      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-True}
      # Defaults to on. Set to False in .env only when TLS is terminated
      # by something in front that does not forward X-Forwarded-Proto,
      # otherwise Django redirects in a loop.
      DJANGO_SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-True}
    volumes:
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Same origin: nginx proxies /api to the backend, so the browser
        # never makes a cross-origin request and no CORS is involved.
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_started

volumes:
  postgres_data:
  media_data:
