# One-click deploy of the Django API to Render's free tier.
#
# This is the piece Supabase cannot host: Supabase is Postgres plus
# PostgREST, Auth, Storage and Deno Edge Functions, so there is nowhere
# in it to run Python. The split ends up as:
#
#   Vercel     the React SPA, and a proxy for /api/*  (static + edge)
#   Render     this service                           (Django + gunicorn)
#   Supabase   Postgres                               (the database only)
#
# The browser only ever talks to the Vercel origin. frontend/vercel.json
# rewrites /api/* to this service, so the session cookie is first-party.
# Pointing the SPA straight at .onrender.com instead would make that
# cookie third-party: Safari and iOS block those outright, and the access
# token is held in memory only, so every page reload would log a parent
# out. Keep the proxy.
#
# To use it: Render → New → Blueprint → point at this repository.
# Render reads this file, builds backend/Dockerfile, and asks for the
# values marked `sync: false` below.
#
# The free plan sleeps after 15 minutes of inactivity and takes roughly
# 50 seconds to wake. That is survivable for a demo and irritating for
# daily use by staff; the starter plan removes it.
services:
  - type: web
    name: creche-api
    runtime: docker
    plan: free
    region: frankfurt          # closest to Tunisia of the free regions
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod

      # Supabase → Project Settings → Database → Connection string.
      #
      # Both are the **session pooler** on port 5432
      # (aws-N-<region>.pooler.supabase.com): Supabase's direct host,
      # db.<ref>.supabase.co, resolves to IPv6 only and Render has no IPv6
      # egress, so it is unreachable from here and must not be used.
      #
      # The session pooler holds one backend per connection, so migrations
      # are safe over it — unlike the transaction pooler on 6543, which
      # reassigns a backend per transaction and breaks migration locks.
      - key: DATABASE_URL
        sync: false
      - key: MIGRATION_DATABASE_URL
        sync: false

      # Sized for a pooler. Both fail silently when wrong against a
      # transaction pooler: persistent connections hold a backend it has
      # already reassigned, and a server-side cursor opened on one backend
      # and read from another raises InvalidCursorName. On the session
      # pooler they are merely conservative — a fresh connection per
      # request — which is the right trade on a plan that sleeps anyway.
      - key: DB_CONN_MAX_AGE
        value: "0"
      - key: DB_DISABLE_SERVER_SIDE_CURSORS
        value: "True"
      - key: DB_SSLMODE
        value: require

      # Generated once by Render and then fixed. They must differ: one
      # signs sessions, the other is the HMAC key that makes every stored
      # access code unreadable without it. Rotating the second one locks
      # every family out, so it is generated here and never touched again.
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: ACCESS_CODE_HMAC_KEY
        generateValue: true

      # DJANGO_ALLOWED_HOSTS is this service's own .onrender.com hostname:
      # Vercel's proxy rewrites Host to the destination, so that is what
      # Django sees. CSRF_TRUSTED_ORIGINS is the *browser's* origin, the
      # vercel.app one, because the proxy forwards Origin unchanged.
      # CORS_ALLOWED_ORIGINS is unused while the proxy is in place (no
      # request is cross-origin from the browser's point of view) and is
      # kept only so a direct-to-API setup still works.
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false

      # Render terminates TLS in front of this container and sets
      # X-Forwarded-Proto, which prod settings already trust — so Django
      # must not redirect again or the request loops.
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "False"

      - key: NURSERY_TIMEZONE
        value: Africa/Tunis

      # gunicorn binds 8000 (backend/Dockerfile), Render probes 10000 by
      # default and would report the service as unhealthy with a container
      # that is serving perfectly well.
      - key: PORT
        value: "8000"

      # Left to Render, which sets 1 on the free plan's 512 MB. Named here
      # only so it is visible: raising it is how you add capacity on a
      # paid plan, and three workers is what will not fit in 512 MB.
      - key: WEB_CONCURRENCY
        value: "1"
