# Security headers.
#
# nginx does NOT merge add_header across levels: a location block that
# declares any add_header of its own silently discards every add_header
# inherited from the server block. Keeping them in one file and including
# it in each location is the only reliable way to guarantee they are sent.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self'; font-src 'self'; connect-src 'self'; frame-src https://www.facebook.com https://www.google.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
