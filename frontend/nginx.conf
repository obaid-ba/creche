server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The app is behind a proxy that terminates TLS; do not advertise the
    # server version to anyone probing it.
    server_tokens off;

    # Security headers live in an include because nginx discards inherited
    # add_header directives in any location that sets one of its own.
    # See security-headers.conf.

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Vite emits content-hashed filenames, so these can be cached forever.
    location /assets/ {
        include /etc/nginx/conf.d/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Media and uploaded files are proxied to the API, which checks
    # permissions before serving them.
    location /media/ {
        include /etc/nginx/conf.d/security-headers.conf;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        include /etc/nginx/conf.d/security-headers.conf;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 12M;   # above the app's 10 MB upload cap
    }

    # SPA fallback: every unmatched path returns index.html so client-side
    # routes survive a hard refresh. Must come last.
    location / {
        include /etc/nginx/conf.d/security-headers.conf;
        try_files $uri $uri/ /index.html;
        # index.html itself must never be cached, or a deploy leaves
        # browsers pointing at asset hashes that no longer exist.
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
