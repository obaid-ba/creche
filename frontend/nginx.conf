server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The app is behind a proxy that terminates TLS; do not advertise the
    # server version to anyone probing it.
    server_tokens off;

    # Security headers. The backend sets its own on API responses; these
    # cover the documents nginx serves.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # A CSP tight enough to matter: no inline script, and connections only
    # to this origin. 'unsafe-inline' remains for styles because Tailwind
    # emits an inline style block for its theme tokens.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self'; font-src 'self'; connect-src 'self'; frame-src https://www.facebook.com https://www.google.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Vite emits content-hashed filenames, so these can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Media and uploaded files are proxied to the API, which checks
    # permissions before serving them.
    location /media/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 12M;   # above the app's 10 MB upload cap
    }

    # SPA fallback: every unmatched path returns index.html so client-side
    # routes survive a hard refresh. Must come last.
    location / {
        try_files $uri $uri/ /index.html;
        # index.html itself must never be cached, or a deploy leaves
        # browsers pointing at asset hashes that no longer exist.
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
